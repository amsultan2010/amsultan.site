<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff4d1a" />
    <meta
      name="description"
      content="Abdullah Sultan's resume: education, experience, awards and skills."
    />
    <link rel="canonical" href="https://www.amsultan.site/resume" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icons/abdullah-favicon.png" />
    <link rel="apple-touch-icon" href="/icons/abdullah-apple-touch.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Resume | Abdullah Sultan</title>
    <style>
      :root {
        --orange: #ff4d1a;
        --cream: #fffaf5;
        --ink: #120e0c;
        --line-soft: rgba(18, 14, 12, 0.2);
        --gutter: clamp(1rem, 2.4vw, 2.5rem);
        --mono: "IBM Plex Mono", ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--orange);
      }

      body {
        margin: 0;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        gap: var(--gutter);
        padding: var(--gutter);
        color: var(--ink);
        background: var(--orange);
        text-transform: lowercase;
      }

      ::selection {
        color: var(--cream);
        background: var(--ink);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid var(--cream);
        outline-offset: 3px;
      }

      .mono {
        font-family: var(--mono);
        font-size: 0.7rem;
        letter-spacing: 0.04em;
        font-weight: 500;
      }

      .top {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--line-soft);
      }

      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 1.25rem;
      }

      .top a:hover {
        color: var(--cream);
      }

      .top a:active {
        color: var(--ink);
        text-decoration: underline;
        text-underline-offset: 0.3em;
      }

      .doc {
        flex: 1;
        min-height: 0;
        background: var(--cream);
        border: 2px solid var(--ink);
        box-shadow: 6px 6px 0 var(--ink);
      }

      .doc iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
    <script type="module">
      import { inject } from "@vercel/analytics";
      inject({ mode: import.meta.env.DEV ? "development" : "production" });
    </script>
  </head>
  <body>
    <header class="top">
      <a class="mono" href="/">abdullah sultan</a>
      <nav class="nav mono" aria-label="primary">
        <a href="/">me</a>
        <a href="/work">work</a>
        <a href="/life">life</a>
        <!-- the google doc is the source: editing it updates this page and the pdf -->
        <a href="https://docs.google.com/document/d/1nVHxfiJFt9ZZVExdiRI2Mn0z1p83P-_988iCctnIAm8/export?format=pdf">download pdf</a>
      </nav>
    </header>

    <main class="doc">
      <iframe
        title="abdullah sultan's resume"
        src="https://docs.google.com/document/d/1nVHxfiJFt9ZZVExdiRI2Mn0z1p83P-_988iCctnIAm8/preview"
      ></iframe>
    </main>
  </body>
</html>
