<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#073b4c" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="that page does not exist on amsultan.site. head back to the homepage."
    />
    <link rel="icon" href="/icons/site-v7.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/site-32-v7.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/site-192-v7.png" />
    <link rel="apple-touch-icon" href="/icons/apple-v7.png" />
    <link rel="preload" href="/fonts/geist-serif-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/host-grotesk-light.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/fonts.css" />
    <title>404 not found | Abdullah Sultan</title>
    <style>
      :root {
        --orange: #f54937;
        --cream: #d5eef2;
        --white: #d5eef2;
        --ink: #073b4c;
        --ink-soft: rgba(7, 59, 76, 0.62);
        --line-soft: rgba(213, 238, 242, 0.35);
        --gutter: clamp(1.35rem, 3.1vw, 3.4rem);
        --display: "Geist Serif", Georgia, serif;
        --serif: "Geist Serif", Georgia, serif;
        --mono: "Host Grotesk", "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--ink);
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 3rem;
        padding: var(--gutter);
        color: var(--white);
        background: var(--ink);
        font-family: var(--serif);
        text-transform: lowercase;
        text-rendering: optimizeLegibility;
        font-synthesis: none;
      }

      ::selection {
        color: var(--cream);
        background: var(--ink);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid var(--white);
        outline-offset: 3px;
      }

      .mono {
        font-family: var(--mono);
        font-size: 1.15rem;
        letter-spacing: 0;
        font-weight: 300;
      }

      .top {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--line-soft);
      }

      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 1.25rem;
      }

      .top a:hover {
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      /* a press drops back to ink and picks up a rule, so it reads on top of the hover */
      .top a:active {
        color: var(--ink);
        text-decoration: underline;
        text-underline-offset: 0.3em;
      }

      main {
        display: grid;
        gap: 1.5rem;
        max-width: 48rem;
      }

      h1 {
        margin: 0;
        font-family: var(--display);
        font-weight: 800;
        letter-spacing: 0;
        line-height: 0.9;
        font-size: clamp(4rem, 22vw, 16rem);
      }

      .lede {
        margin: 0;
        max-width: 34rem;
        font-size: clamp(1.15rem, 2.2vw, 1.5rem);
        line-height: 1.4;
        color: var(--white);
      }

      .home {
        justify-self: start;
        display: inline-block;
        padding: 0.85rem 1.4rem;
        background: var(--orange);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 1.15rem;
        font-weight: 300;
        letter-spacing: 0;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .home:hover,
      .home:active {
        background: var(--cream);
        color: var(--ink);
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding-top: 1rem;
        border-top: 1px solid var(--line-soft);
        color: var(--white);
      }
    </style>
    <script type="module">
      import { inject } from "@vercel/analytics";
      inject({ mode: import.meta.env.DEV ? "development" : "production" });
    </script>
  </head>
  <body>
    <header class="top">
      <a class="mono" href="/">abdullah sultan</a>
      <nav class="nav mono" aria-label="primary">
        <a href="/">me</a>
        <a href="/work">work</a>
        <a href="/life">life</a>
        <a href="/resume" target="_blank" rel="noreferrer">resume</a>
      </nav>
    </header>

    <main>
      <h1>404</h1>
      <p class="lede">
        this page is not here. maybe it moved, maybe the link was mistyped, maybe it never
        existed. everything is still under me, work and life, up top.
      </p>
      <a class="home" href="/">back to the homepage</a>
    </main>

    <footer>
      <span class="mono">riyadh, ksa</span>
      <span class="mono">error 404</span>
    </footer>
  </body>
</html>
