<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10" shape-rendering="crispEdges">
  <!-- left arm -->
  <rect x="0" y="3" width="2" height="2" fill="#E5433A"/>
  <!-- right arm -->
  <rect x="8" y="3" width="2" height="2" fill="#E5433A"/>
  <!-- body -->
  <rect x="1" y="1" width="8" height="6" fill="#E5433A"/>
  <!-- eyes (black squares) -->
  <rect x="3" y="3" width="1" height="1" fill="#111111"/>
  <rect x="6" y="3" width="1" height="1" fill="#111111"/>
  <!-- legs -->
  <rect x="2" y="7" width="1" height="3" fill="#E5433A"/>
  <rect x="4" y="7" width="1" height="3" fill="#E5433A"/>
  <rect x="6" y="7" width="1" height="3" fill="#E5433A"/>
  <rect x="8" y="7" width="1" height="3" fill="#E5433A"/>
</svg>
