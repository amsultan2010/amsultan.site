<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <!-- vercel.json sends a 308 to /resume for this path in production, which
         serves resume.pdf; the refresh below is the fallback for a local
         preview or a direct file open. -->
    <meta http-equiv="refresh" content="0; url=/resume.pdf" />
    <link rel="canonical" href="https://www.amsultan.site/resume" />
    <title>resume | Abdullah Sultan</title>
    <!-- this page is on screen for a moment at most, so it borrows the site's
         colours without fetching its webfonts -->
    <style>
      body {
        margin: 0;
        padding: clamp(1rem, 2.4vw, 2.5rem);
        color: #120e0c;
        background: #ff4d1a;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        text-transform: lowercase;
      }

      a {
        color: inherit;
      }

      a:hover {
        color: #fffaf5;
      }

      a:focus-visible {
        outline: 3px solid #fffaf5;
        outline-offset: 3px;
      }

      a:active {
        color: #120e0c;
        text-decoration-thickness: 3px;
      }
    </style>
  </head>
  <body>
    <p>redirecting to <a href="/resume.pdf">abdullah sultan's resume</a>.</p>
    <p><a href="/">back to amsultan.site</a></p>
  </body>
</html>
